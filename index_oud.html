<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Viool Klassiek 2.1 - dé Academie, Ieper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viool">
<meta name="theme-color" content="#4A3728">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #F6EFE0;
    --ink: #4A3728;
    --ink-soft: #8A7660;
    --card: #FFFDF7;
    --shadow: rgba(74,55,40,0.16);

    /* muted, watercolour-ish Waldorf palette */
    --l1: #D98C7A; --l1-light: #F3DBD3; /* soft coral   */
    --l2: #D9A45E; --l2-light: #F2E1C7; /* warm apricot */
    --l3: #C9B24E; --l3-light: #EEE7C4; /* soft gold    */
    --l4: #8FAE7D; --l4-light: #DCE7D3; /* sage green   */
    --l5: #8CA0C4; --l5-light: #DBE2EE; /* dusty blue   */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 10%, rgba(217,140,122,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 15%, rgba(140,160,196,0.10), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(143,174,125,0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  h1, h2, .headline, .num {
    font-family: 'Patrick Hand', Georgia, serif;
    font-weight: 400;
    margin: 0;
  }

  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .screen.active { display: flex; }

  /* ---------- Shared header bits ---------- */
  .app-header {
    text-align: center;
    padding: 30px 20px 10px;
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 34px;
    color: var(--ink);
    letter-spacing: 0.3px;
  }
  .app-header p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 16px;
    font-weight: 500;
  }
  .app-header .rainbow {
    display: block;
    margin: 10px auto 0;
    width: 90px;
    height: 14px;
  }

  .credit {
    flex-shrink: 0;
    text-align: center;
    padding: 16px 10px 4px;
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
  }

  .top-back {
    flex-shrink: 0;
    padding: 16px 18px 0;
  }
  .back-btn {
    border: none;
    background: rgba(255,255,255,0.55);
    color: #4A3728;
    font-size: 17px;
    font-weight: 600;
    font-family: 'Quicksand', sans-serif;
    padding: 10px 18px;
    border-radius: 999px;
  }
  .back-btn:active { background: rgba(255,255,255,0.8); }

  /* ---------- Home: choose Lessen / Liedjes ---------- */
  #screen-home { padding: 10px 20px 20px; align-items: stretch; }

  .home-choices {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
    justify-content: center;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }

  .choice-btn {
    border: none;
    width: 100%;
    min-height: 120px;
    border-radius: 58% 42% 47% 53% / 45% 55% 45% 55%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--ink);
    box-shadow: 0 10px 20px var(--shadow);
  }
  .choice-btn:active { transform: scale(0.96); }
  .choice-btn .icon { width: 36px; height: 36px; margin-bottom: 2px; }
  .choice-btn .title { font-family: 'Patrick Hand', serif; font-size: 34px; line-height: 1; }

  .choice-btn.lessen { background: var(--l1-light); }
  .choice-btn.liedjes { background: var(--l5-light); }

  /* ---------- Lesson picker ---------- */
  #screen-lessons { padding: 10px 20px 20px; align-items: stretch; }

  .lesson-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    align-content: center;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  @media (min-width: 700px) {
    .lesson-grid { grid-template-columns: repeat(5, 1fr); }
  }

  .lesson-card {
    border: none;
    padding: 26px 14px;
    min-height: 155px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #4A3728;
    box-shadow: 0 10px 20px var(--shadow);
    transition: transform 0.15s ease;
  }
  .lesson-card:active { transform: scale(0.95) rotate(-1deg); }

  .lesson-card.blob1 { border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; }
  .lesson-card.blob2 { border-radius: 46% 54% 61% 39% / 42% 47% 53% 58%; }
  .lesson-card.blob3 { border-radius: 55% 45% 40% 60% / 60% 45% 55% 40%; }
  .lesson-card.blob4 { border-radius: 40% 60% 55% 45% / 50% 55% 45% 50%; }
  .lesson-card.blob5 { border-radius: 58% 42% 47% 53% / 45% 60% 40% 55%; }

  .lesson-card .num { font-size: 36px; line-height: 1; }

  .lesson-card.l1 { background: var(--l1-light); }
  .lesson-card.l2 { background: var(--l2-light); }
  .lesson-card.l3 { background: var(--l3-light); }
  .lesson-card.l4 { background: var(--l4-light); }
  .lesson-card.l5 { background: var(--l5-light); }

  /* ---------- Video picker ---------- */
  #screen-videos { padding: 0; }

  .subheader {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px;
    flex-shrink: 0;
    color: #4A3728;
  }
  .subheader h2 { font-size: 26px; flex: 1; }

  .video-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    -webkit-overflow-scrolling: touch;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 640px;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    .video-grid { grid-template-columns: repeat(5, 1fr); }
  }

  .video-btn {
    border: none;
    border-radius: 50%;
    background: var(--card);
    color: var(--ink);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Patrick Hand', serif;
    font-size: 32px;
    box-shadow: 0 6px 14px var(--shadow);
    position: relative;
  }
  .video-btn:active { transform: scale(0.93); }

  .video-btn .note-badge {
    position: absolute;
    top: -6px;
    right: -4px;
    width: 22px;
    height: 22px;
  }

  /* ---------- Songs list ---------- */
  #screen-songs { padding: 0; }

  .song-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .song-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 640px;
    margin: 0 auto;
  }
  .song-btn {
    border: none;
    text-align: left;
    background: var(--card);
    color: var(--ink);
    border-radius: 18px;
    padding: 16px 18px;
    font-family: 'Quicksand', sans-serif;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 4px 10px var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .song-btn:active { transform: scale(0.98); }
  .song-btn .note-badge { width: 20px; height: 20px; flex-shrink: 0; }
  .song-btn .song-name { flex: 1; }

  /* ---------- Video player ---------- */
  #screen-player { background: #2B211A; justify-content: center; position: relative; }
  #screen-player video { width: 100%; height: 100%; object-fit: contain; background: #2B211A; }
  .player-back {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 14px);
    left: 14px;
    z-index: 5;
    border: none;
    background: rgba(255,255,255,0.85);
    color: #4A3728;
    font-size: 17px;
    font-weight: 600;
    font-family: 'Quicksand', sans-serif;
    padding: 10px 18px;
    border-radius: 999px;
  }

  /* ---------- Song player ---------- */
  #screen-song-player {
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .song-player-card {
    max-width: 420px;
    width: 100%;
  }
  .song-player-card .note-big { width: 60px; height: 60px; margin-bottom: 10px; }
  .song-player-card h2 { font-size: 26px; margin-bottom: 18px; }
  .song-player-card audio { width: 100%; }
</style>
</head>
<body>

<!-- ============ SCREEN 0: choose Lessen or Liedjes ============ -->
<section id="screen-home" class="screen active">
  <div class="app-header">
    <h1>Viool Klassiek 2.1 - dé Academie, Ieper</h1>
    <p>Wat wil je doen?</p>
    <svg class="rainbow" viewBox="0 0 90 14" xmlns="http://www.w3.org/2000/svg">
      <path d="M2,13 Q45,-6 88,13" fill="none" stroke="#D98C7A" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,13 Q45,-2 84,13" fill="none" stroke="#D9A45E" stroke-width="2" stroke-linecap="round"/>
      <path d="M10,13 Q45,2 80,13" fill="none" stroke="#C9B24E" stroke-width="2" stroke-linecap="round"/>
      <path d="M14,13 Q45,6 76,13" fill="none" stroke="#8FAE7D" stroke-width="2" stroke-linecap="round"/>
      <path d="M18,13 Q45,9 72,13" fill="none" stroke="#8CA0C4" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="home-choices">
    <button class="choice-btn lessen" onclick="showLessons()">
      <span class="title">Lessen</span>
    </button>
    <button class="choice-btn liedjes" onclick="showSongs()">
      <span class="title">Liedjes</span>
    </button>
  </div>
  <footer class="credit">Video's gemaakt door Tim Breckpot &middot; dé Academie, Ieper<br>&copy; alle rechten voorbehouden</footer>
</section>

<!-- ============ SCREEN 1: choose a lesson ============ -->
<section id="screen-lessons" class="screen">
  <div class="top-back"><button class="back-btn" onclick="showHome()">‹ Start</button></div>
  <div class="app-header" style="padding-top:10px;">
    <h1 style="font-size:28px;">Kies een les</h1>
  </div>
  <div class="lesson-grid" id="lessonGrid"></div>
</section>

<!-- ============ SCREEN 2: choose a video ============ -->
<section id="screen-videos" class="screen">
  <div class="subheader" id="videoHeader">
    <button class="back-btn" onclick="showLessons()">‹ Lessen</button>
    <h2 id="videoHeaderTitle">Les</h2>
  </div>
  <div class="video-scroll">
    <div class="video-grid" id="videoGrid"></div>
  </div>
</section>

<!-- ============ SCREEN 3: play a video ============ -->
<section id="screen-player" class="screen">
  <button class="player-back" onclick="stopAndShowVideos()">‹ Terug</button>
  <video id="player" playsinline controls></video>
</section>

<!-- ============ SCREEN 4: songs list ============ -->
<section id="screen-songs" class="screen">
  <div class="subheader" id="songsHeader" style="background:var(--l5-light);">
    <button class="back-btn" onclick="showHome()">‹ Start</button>
    <h2>Liedjes</h2>
  </div>
  <div class="song-scroll">
    <div class="song-list" id="songList"></div>
  </div>
</section>

<!-- ============ SCREEN 5: play a song ============ -->
<section id="screen-song-player" class="screen">
  <div class="top-back" style="align-self:flex-start;"><button class="back-btn" onclick="stopAndShowSongs()">‹ Liedjes</button></div>
  <div class="song-player-card">
    <svg class="note-big" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="7.5" cy="18" rx="4" ry="3" transform="rotate(-15 7.5 18)" fill="#8CA0C4" stroke="#4A3728" stroke-width="0.6"/>
      <rect x="10.6" y="4" width="1.6" height="14.2" fill="#4A3728"/>
      <path d="M12.2 4 C16.3 4.6 17.3 8.2 15.2 10.6 C15.9 8.1 14.1 6.1 12.2 7.1 Z" fill="#4A3728"/>
    </svg>
    <h2 id="songTitle">Titel</h2>
    <audio id="audioPlayer" controls></audio>
  </div>
</section>

<script>
  /* =====================================================================
     LES-INSTELLINGEN (LESSON CONFIG)
  ===================================================================== */
  const LESSONS = [
    { id: 1, count: 13, cls: "l1", blob: "blob1" },
    { id: 2, count: 4,  cls: "l2", blob: "blob2" },
    { id: 3, count: 5,  cls: "l3", blob: "blob3" },
    { id: 4, count: 4,  cls: "l4", blob: "blob4" },
    { id: 5, count: 2,  cls: "l5", blob: "blob5" },
  ];

  /* =====================================================================
     LIEDJES (SONGS)
     - Exacte bestandsnamen zoals ze in de map Liedjes/ staan.
     - De titel die getoond wordt, wordt automatisch afgeleid door het
       stukje "BT" (en het komma/spatie ervoor) aan het einde te knippen.
  ===================================================================== */
  const SONG_FILES = [
    "01 Bow down, O Belinda, BT.mp3",
    "02 Under arrest!, BT.mp3",
    "03 Jim along Josie, BT.mp3",
    "04 Down up, BT.mp3",
    "05 Two in a boat, BT.mp3",
    "06 London Bridge, BT.mp3",
    "07 Fast lane, BT.mp3",
    "08 In flight, BT.mp3",
    "09 Lift off! BT.mp3",
    "10 Katies waltz, BT.mp3",
    "11 Copy cat, BT.mp3",
    "12 Tap dancer, BT.mp3",
    "13 Rhythm fever, BT.mp3",
    "14 Here it comes! BT.mp3",
    "15 So there! BT.mp3",
    "16 Rowing boat, BT.mp3",
    "17 Ally bally, BT.mp3",
    "18 Tiptoe boo! BT.mp3",
    "19 Travellin slow, BT.mp3",
    "20 Lazy cowboy, BT.mp3",
    "21 Off to Paris, BT.mp3",
    "22 Clares song, BT.mp3",
    "23 City lights, BT.mp3",
    "24 The three friends, BT.mp3",
    "25 Chinese garden, BT.mp3",
    "26 Summer sun, BT.mp3",
    "27 Phoebe in her petticoat, BT.mp3",
    "28 Ready, steady, go now! BT.mp3",
    "29 Shortnin bread, BT.mp3",
    "30 Happy go lucky, BT.mp3",
    "31 The mocking bird, BT.mp3",
    "32 Algy met a bear, BT.mp3",
    "33 Listen to the rhythm, BT.mp3",
    "34 Cattle ranch blues, BT.mp3",
    "35 In the groove, BT.mp3",
    "36 Stamping dance, BT.mp3",
    "37 Distant bells, BT.mp3",
    "38 Lazy scale, BT.mp3",
    "39 The old castle, BT.mp3",
    "40 Rocking horse, BT.mp3",
    "41 Patricks reel, BT.mp3",
    "42 Calypso time, BT.mp3",
    "43 Knock, knock! BT.mp3",
    "44 Lil Liza Jane, BT.mp3",
    "45 Carrion crow, BT.mp3",
    "46 Flying high, BT.mp3",
    "47 Fiddle time, BT.mp3",
    "48 Fast lane, BT.mp3",
    "49 Rhythm fever, BT.mp3",
    "50 Ready, steady... BT.mp3",
    "51 Listen to the rhythm, BT.mp3",
    "52 Patricks reel, BT.mp3",
    "53 Fiddle time, BT.mp3",
  ];

  function titleFromFile(filename) {
    let t = filename.replace(/\.mp3$/i, '');
    t = t.replace(/\s*BT\s*$/i, '');
    t = t.replace(/,\s*$/, '');
    return t.trim();
  }

  const NOTE_SVG = `<svg class="note-badge" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="7.5" cy="18" rx="4" ry="3" transform="rotate(-15 7.5 18)" fill="#8CA0C4" stroke="#4A3728" stroke-width="0.6"/>
    <rect x="10.6" y="4" width="1.6" height="14.2" fill="#4A3728"/>
    <path d="M12.2 4 C16.3 4.6 17.3 8.2 15.2 10.6 C15.9 8.1 14.1 6.1 12.2 7.1 Z" fill="#4A3728"/>
  </svg>`;

  const screenHome         = document.getElementById('screen-home');
  const screenLessons      = document.getElementById('screen-lessons');
  const screenVideos       = document.getElementById('screen-videos');
  const screenPlayer       = document.getElementById('screen-player');
  const screenSongs        = document.getElementById('screen-songs');
  const screenSongPlayer   = document.getElementById('screen-song-player');

  const lessonGrid       = document.getElementById('lessonGrid');
  const videoGrid        = document.getElementById('videoGrid');
  const videoHeader       = document.getElementById('videoHeader');
  const videoHeaderTitle  = document.getElementById('videoHeaderTitle');
  const player            = document.getElementById('player');
  const songList          = document.getElementById('songList');
  const songTitle         = document.getElementById('songTitle');
  const audioPlayer       = document.getElementById('audioPlayer');

  const ALL_SCREENS = [screenHome, screenLessons, screenVideos, screenPlayer, screenSongs, screenSongPlayer];

  let currentLesson = null;

  function todayString() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function watchedKey(lessonId, i) { return `viool-gezien-${lessonId}-${i}`; }
  function isWatched(lessonId, i) {
    try { return localStorage.getItem(watchedKey(lessonId, i)) === todayString(); }
    catch (e) { return false; }
  }
  function markWatched(lessonId, i) {
    try { localStorage.setItem(watchedKey(lessonId, i), todayString()); } catch (e) {}
  }

  function buildLessonGrid() {
    lessonGrid.innerHTML = '';
    LESSONS.forEach(lesson => {
      const btn = document.createElement('button');
      btn.className = 'lesson-card ' + lesson.cls + ' ' + lesson.blob;
      btn.innerHTML = `<span class="num">Les ${lesson.id}</span>`;
      btn.onclick = () => openLesson(lesson);
      lessonGrid.appendChild(btn);
    });
  }

  function buildSongList() {
    songList.innerHTML = '';
    SONG_FILES.forEach(filename => {
      const btn = document.createElement('button');
      btn.className = 'song-btn';
      btn.innerHTML = `<span class="song-name">${titleFromFile(filename)}</span>`;
      btn.onclick = () => playSong(filename);
      songList.appendChild(btn);
    });
  }

  function openLesson(lesson) {
    currentLesson = lesson;
    videoHeaderTitle.textContent = `Les ${lesson.id}`;
    videoHeader.style.background = `var(--${lesson.cls}-light)`;
    videoGrid.innerHTML = '';
    for (let i = 1; i <= lesson.count; i++) {
      const btn = document.createElement('button');
      btn.className = 'video-btn';
      btn.innerHTML = String(i) + (isWatched(lesson.id, i) ? NOTE_SVG : '');
      btn.onclick = () => playVideo(lesson, i);
      videoGrid.appendChild(btn);
    }
    show(screenVideos);
  }

  function playVideo(lesson, index) {
    player.src = `Lesson${lesson.id}/${index}.mov`;
    show(screenPlayer);
    player.play().catch(() => {});
    markWatched(lesson.id, index);
  }

  function stopAndShowVideos() {
    player.pause();
    player.removeAttribute('src');
    player.load();
    openLesson(currentLesson); // rebuild so the new note shows up
  }

  function playSong(filename) {
    songTitle.textContent = titleFromFile(filename);
    audioPlayer.src = `Liedjes/${encodeURIComponent(filename)}`;
    show(screenSongPlayer);
    audioPlayer.play().catch(() => {});
  }

  function stopAndShowSongs() {
    audioPlayer.pause();
    audioPlayer.removeAttribute('src');
    audioPlayer.load();
    show(screenSongs);
  }

  function showHome()    { show(screenHome); }
  function showLessons() { show(screenLessons); }
  function showSongs()   { show(screenSongs); }

  function show(target) {
    ALL_SCREENS.forEach(s => s.classList.remove('active'));
    target.classList.add('active');
  }

  buildLessonGrid();
  buildSongList();
</script>
</body>
</html>
